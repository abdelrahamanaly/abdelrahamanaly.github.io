# Search and link previews. Leave a value empty ("") to leave it out.
google_site_verification: ""   # the content="..." value of the meta tag from Google Search Console
linkedin: ""                   # your LinkedIn profile URL, e.g. https://www.linkedin.com/in/...
og_image: "/assets/preview.png"                 # a 1200x627 image for LinkedIn previews, e.g. /assets/preview.png

# Not part of the published site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
