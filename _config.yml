# Jekyll configuration. GitHub Pages builds this site on every merge to main.
title: "Abdelrahaman (Abdel) Aly · Cryptographer and researcher"
description: "Abdelrahaman (Abdel) Aly, cryptographer and researcher: privacy-enhancing technologies, secure multi-party computation, homomorphic encryption and privacy-preserving machine learning."
url: "https://abdelrahamanaly.github.io"
baseurl: ""

# Builds /sitemap.xml for search engines (supported by GitHub Pages).
plugins:
