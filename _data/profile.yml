about:
  heading: "Papers in,"
  heading_em: "software out."
  text: >-
    Eighteen years of turning cryptography papers into software people can run. I wrote MPC
    protocols for electricity-market auctions during my PhD, maintained the SCALE-MAMBA framework
    at KU Leuven, shipped cryptographic services (Apple Pay among them) at Belgium's second-largest
    bank, and now lead a team at TII building LLM inference on encrypted data. I do my best work
    where research meets engineering: choosing the protocol that fits, setting security parameters
    honestly, and getting a small team to deliver it.

