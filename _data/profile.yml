about:
  heading: "Papers in,"
  heading_em: "software out."
  # One entry per paragraph.
  paragraphs:
    - >-
      I make secure computation practical: protocols that let parties compute on data
      none of them can see, and the software that runs them.
    - >-
      PhD at UCLouvain, on MPC for auctions, graphs and electricity markets. Postdoc at
      COSIC, KU Leuven, with Bart Preneel and Nigel Smart, as one of the maintainers of
      SCALE-MAMBA. In industry, software design for banks at Accenture, then at KBC the
      planning, assessment and design of the bank's classical cryptography, its crypto-agility
      and its post-quantum transition.
    - >-
      I am part of TII's PETs team, where we research, design and develop applied
      privacy-enhancing technologies. Today, I work on R&D for privacy-preserving machine
      learning and other cryptographic nuggets.

